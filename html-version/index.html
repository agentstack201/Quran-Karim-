<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>فهرس السور · تلاوة</title>
    <meta
      name="description"
      content="فهرس سور القرآن الكريم الـ١١٤ كاملة — بحث فوري بالاسم أو الرقم، وترتيب حسب المصحف أو النزول أو عدد الآيات. نسخة HTML/CSS/JS خام بدون أي إطار عمل."
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="index.html">
          <span class="brand-mark" aria-hidden="true">﷽</span>
          <span class="brand-name">تلاوة</span>
        </a>
        <nav class="crumbs" aria-label="مسار التصفح">
          <span>الرئيسية</span>
          <span class="crumb-sep" aria-hidden="true">‹</span>
          <span aria-current="page">السور</span>
        </nav>
      </div>
    </header>

    <main class="page">
      <div class="container">
        <div class="page-header">
          <h1>فهرس السور</h1>
          <p id="chapter-count-subtitle" class="subtitle">
            ١١٤ سورة — ابحث بالاسم أو الرقم، ورتّبها كما تشاء
          </p>
        </div>

        <div class="controls">
          <div class="search-wrap">
            <label for="chapter-filter" class="sr-only">ابحث في أسماء السور</label>
            <svg
              class="search-icon"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" />
              <path
                d="m20 20-3.5-3.5"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
            <input
              id="chapter-filter"
              type="search"
              placeholder="اسم السورة أو رقمها…"
              autocomplete="off"
            />
          </div>

          <div class="segmented" role="group" aria-label="ترتيب السور">
            <button type="button" class="segment is-active" data-sort="mushaf">ترتيب المصحف</button>
            <button type="button" class="segment" data-sort="revelation">ترتيب النزول</button>
            <button type="button" class="segment" data-sort="length">عدد الآيات</button>
          </div>

          <div class="segmented" role="group" aria-label="ترشيح حسب مكان النزول">
            <button type="button" class="segment is-active" data-filter="all">الكل</button>
            <button type="button" class="segment" data-filter="meccan">مكية</button>
            <button type="button" class="segment" data-filter="medinan">مدنية</button>
          </div>

          <p id="chapter-count" class="result-count" role="status" aria-live="polite">١١٤ سورة</p>
        </div>

        <p id="empty-state" class="empty-state" hidden>
          لا توجد سورة مطابقة — جرّب اسماً آخر، أو اكتب رقم السورة، أو أزل الترشيح.
        </p>

        <ul id="chapter-grid" class="chapter-grid"></ul>
      </div>
    </main>

    <footer class="site-footer">
      <p>
        نسخة HTML · CSS · JavaScript خام — بلا أي إطار عمل — مشروع أكاديمي مبني على بيانات تطبيق
        «تلاوة»
      </p>
    </footer>

    <script src="data.js"></script>
    <script src="script.js"></script>
  </body>
</html>
